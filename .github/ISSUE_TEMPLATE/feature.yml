name: Propuesta de mejora
description: Proponer una mejora o funcionalidad nueva para ResTube.
labels: ["status:triage", "type:feature"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Qué te gustaría que ResTube haga y por qué.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Beneficio
      description: Qué problema resuelve o qué valor agrega.
    validations:
      required: true
