# Privileged governance workflow. It runs ONLY trusted code checked out from
# the repository default branch — never pull-request head or merge commits —
# and only performs policy decisions through the GitHub API. Fork code is never
# executed in this job: pull_request_target carries the payload, but the
# checkout below is pinned to github.event.repository.default_branch.
name: Issue approval gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  issues:
    types: [opened, labeled, unlabeled, edited, closed, reopened]

# Repository-wide reconciliation: each run fully re-reads current issue and
# pull request state, so GitHub replacing pending queued runs cannot lose an
# older reconciliation (a newer run re-reads the same fresh state).
concurrency:
  group: issue-policy-reconciliation-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    name: Reconcile labels and PR gate statuses
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile issue labels and pull request gate statuses
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { runPolicy } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-policy.mjs`)
            );
            await runPolicy({
              octokit: github,
              context,
              config: {
                runUrl: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              },
              log: (message) => core.info(message),
            });
